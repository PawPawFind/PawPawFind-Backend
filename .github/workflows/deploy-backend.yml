name: Deploy Backend

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "deploy/pawpawfind-backend.service"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: backend/build/libs/backend-0.0.1-SNAPSHOT.jar
          target: /home/ec2-user/

      - name: Install JAR and restart backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/logs
            # scp-action keeps source folders under ~/backend/build/libs/
            if [ -f ~/backend/build/libs/backend-0.0.1-SNAPSHOT.jar ]; then
              cp ~/backend/build/libs/backend-0.0.1-SNAPSHOT.jar ~/backend-0.0.1-SNAPSHOT.jar
            fi
            sudo systemctl restart pawpawfind-backend
            sleep 3
            sudo systemctl is-active pawpawfind-backend
