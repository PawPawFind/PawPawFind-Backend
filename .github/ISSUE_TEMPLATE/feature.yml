name: 기능 개발
description: 새로운 기능 구현을 위한 Issue를 생성합니다.
title: "[Feature] "
body:
  - type: input
    id: feature_id
    attributes:
      label: 기능 ID
      description: 기능명세서에 정의된 기능 ID를 작성해 주세요.
      placeholder: "예: 9.1"
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: 작업 개요
      description: 구현하려는 기능과 목적을 설명해 주세요.
      placeholder: 추천 수색 영역 생성 기능을 구현한다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 구현할 내용을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 요청/응답 DTO 정의
        - [ ] 비즈니스 로직 구현
        - [ ] API 구현
        - [ ] 테스트 작성
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 이 Issue를 완료로 판단할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] 정상 입력 시 추천 수색 영역을 반환한다.
        - [ ] 잘못된 좌표 입력을 거부한다.
        - [ ] 관련 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: API 명세, 기획 문서, 관련 Issue 등을 작성해 주세요.
      placeholder: |
        - 관련 기능: 9.1
        - 선행 Issue: #번호

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 중복 Issue가 없는지 확인했습니다.
          required: true
        - label: 관련 기획 또는 기능명세를 확인했습니다.
          required: true