name: 환경 설정 및 기타 작업
description: CI, 문서, 리팩터링, 저장소 설정 등의 Issue를 생성합니다.
title: "[Chore] "
body:
  - type: dropdown
    id: category
    attributes:
      label: 작업 종류
      options:
        - 환경 설정
        - CI/CD
        - 문서
        - 리팩터링
        - 테스트
        - 의존성
        - 기타
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: 작업 개요
      description: 작업의 목적과 필요한 이유를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      placeholder: |
        - [ ] 작업 항목 1
        - [ ] 작업 항목 2
        - [ ] 테스트 또는 확인
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 설정이 정상적으로 적용된다.
        - [ ] 기존 기능에 문제가 없다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      placeholder: 관련 문서, 선행 Issue, 설정 링크 등을 작성해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 중복 Issue가 없는지 확인했습니다.
          required: true