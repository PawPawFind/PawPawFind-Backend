name: 버그 수정
description: 발견한 오류를 수정하기 위한 Issue를 생성합니다.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 순서를 작성해 주세요.
      placeholder: |
        1. 특정 API를 호출한다.
        2. 특정 값을 입력한다.
        3. 오류 응답을 확인한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작한다면 어떤 결과가 나와야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 현재 발생하는 결과나 오류 메시지를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      placeholder: |
        - OS:
        - Java/Python 버전:
        - Branch:
        - Commit:

  - type: textarea
    id: tasks
    attributes:
      label: 수정 내용
      placeholder: |
        - [ ] 원인 분석
        - [ ] 버그 수정
        - [ ] 회귀 테스트 추가
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 중복 Issue가 없는지 확인했습니다.
          required: true